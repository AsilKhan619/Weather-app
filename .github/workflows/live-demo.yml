name: Live demo (real providers)

# Manual only - never on push. Runs the documented quickstart from a fresh
# checkout (`cp .env.example .env && make up && make demo`) against the REAL
# Open-Meteo, aviationweather.gov and IEM services, then writes the evidence
# (row counts, NULL-vs-NaN check, reconciliation, ingestion runs) to the job
# summary. It exists to demonstrate the pipeline end to end on a clean machine
# with Docker, independent of any developer laptop.
#
# It spends real API budget (Open-Meteo: ~450 weighted calls for 30 days, of a
# 10,000/day free allowance - see docs/decisions/0004), so run it deliberately.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to backfill (30 costs ~450 Open-Meteo calls)"
        required: true
        default: "30"

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra ingestion

      - name: Configure (the documented quickstart step)
        run: cp .env.example .env

      - name: make up
        run: make up

      - name: make demo
        env:
          DEMO_DAYS: ${{ inputs.days }}
        run: |
          [[ "$DEMO_DAYS" =~ ^[0-9]+$ ]] || { echo "days must be a positive integer"; exit 1; }
          make demo DEMO_DAYS="$DEMO_DAYS"

      - name: Summarize results
        if: always()
        run: |
          q() { docker exec nimbus-postgres psql -U nimbus -d nimbus -P pager=off -c "$1"; }
          {
            echo "## Live demo results (${{ inputs.days }} days)"
            echo
            echo "### Forecasts (silver.forecast)"
            echo '```'
            q "select ingestion_mode, count(*) as rows, count(distinct location_id) as locations, count(distinct model) as models, min(valid_time)::date as first_day, max(valid_time)::date as last_day from silver.forecast group by 1 order by 1"
            echo '```'
            echo "### Observations (silver.observation)"
            echo '```'
            q "select ingestion_mode, count(*) as rows, count(distinct station) as stations, min(observed_at)::date as first_day, max(observed_at)::date as last_day from silver.observation group by 1 order by 1"
            echo '```'
            echo "### Missing values are NULL, never NaN"
            echo '```'
            q "select count(*) filter (where value = 'NaN') as nan_rows, count(*) filter (where value is null) as null_rows from silver.forecast"
            echo '```'
            echo "### Rows per location (forecast)"
            echo '```'
            q "select location_id, count(*) as rows from silver.forecast group by 1 order by 1"
            echo '```'
            echo "### Ingestion runs"
            echo '```'
            q "select source, ingestion_mode, status, messages_produced as produced, messages_failed as failed, error_message from ops.ingestion_runs order by id"
            echo '```'
            echo "### Reconciliation"
            echo '```'
            q "select topic, matched, produced_messages as produced, bronze_messages as bronze, bronze_distinct_events as distinct_events, bronze_unparseable as unparseable, expected_silver_rows as expected, silver_rows as actual, missing_from_silver as missing, extra_in_silver as extra from ops.reconciliation_results order by id"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
