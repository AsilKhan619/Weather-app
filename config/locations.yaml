# ~25 locations across contrasting climates and continents (brief section 5).
# The first 5 shipped in Phase 0/1; Phase 2 expands to the full set. Every
# station id below was verified live against aviationweather.gov's METAR API
# before being added (see ADR 0003) - all report real, current data.
# Phoenix deliberately has a station in a non-DST-observing timezone — a
# real edge case the transform unit tests (brief section 14) must handle.
